# picture-zip — single-node Docker Compose stack
# Web (static Astro build) + Caddy (auto HTTPS) + umami analytics
# Monitoring stack is opt-in via the `monitoring` profile:
#   docker compose --profile monitoring up -d

services:
  web:
    image: ${PICTURE_ZIP_IMAGE:?must_set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      umami:
        condition: service_started
      uptime-kuma:
        condition: service_started
    networks: [internal, edge]

    environment:
      # bcrypt hash for the status.picture-zip.com Basic Auth (see Caddyfile)
      STATUS_BCRYPT_HASH: ${STATUS_BCRYPT_HASH:?must_set}
  umami-db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?must_set}
    volumes:
      - umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.13.2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?must_set}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?must_set}
    depends_on:
      umami-db:
        condition: service_healthy
    networks: [internal]

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    restart: unless-stopped
    volumes:
      - uptime_kuma:/app/data
    networks: [internal]

  # ---- Monitoring stack (opt-in: --profile monitoring) ----
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: [monitoring]
    pid: host
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
    networks: [internal]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    profiles: [monitoring]
    networks: [internal]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?must_set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal]

  loki:
    image: grafana/loki:3.1.2
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - loki_data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.1.2
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?must_set}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?must_set}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:
  umami_db:
  uptime_kuma:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  internal:
  edge:
