groups:
  - name: picture-zip.rules
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "picture-zip unreachable"
          description: "{{ $labels.instance }} has been down for 2 minutes."

      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox"} < time() + 14 * 24 * 3600
        for: 1h
        labels:
          severity: P1
        annotations:
          summary: "TLS certificate expiring < 14 days"
          description: "{{ $labels.instance }} certificate expires soon."

      - alert: DiskSpaceHigh
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 80
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Disk usage > 80%"
          description: "Root filesystem is above 80% on {{ $labels.instance }}."

      - alert: MemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Memory usage > 90%"
          description: "Memory above 90% for 5 minutes on {{ $labels.instance }}."