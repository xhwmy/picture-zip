route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: "$SMTP_TO"
        from: "$SMTP_FROM"
        smarthost: "$SMTP_HOST"
        auth_username: "$SMTP_USER"
        auth_password: "$SMTP_PASSWORD"
        require_tls: true
        send_resolved: true
