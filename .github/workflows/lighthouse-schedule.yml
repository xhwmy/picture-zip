name: Lighthouse Full Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  lighthouse-full:
    name: Full Lighthouse Audit (20 pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm audit:lighthouse:full
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-full
          path: lighthouse-reports/
          retention-days: 30